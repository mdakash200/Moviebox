<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub File Manager Platform</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --bg-card: #131c31;
            --accent-green: #10b981;
            --accent-green-hover: #059669;
            --accent-blue: #3b82f6;
            --accent-red: #ef4444;
            --accent-red-hover: #dc2626;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --border-color: #334155;
            --shadow-sm: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
            --shadow-lg: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Top Header Navbar */
        .navbar {
            background-color: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: var(--shadow-sm);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        .brand i {
            color: var(--accent-green);
            font-size: 1.5rem;
        }

        /* Dropdown Navigation Menu */
        .nav-actions {
            position: relative;
        }

        .menu-btn {
            background: linear-gradient(135deg, #1e293b, #0f172a);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 0.6rem 1.2rem;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: all 0.2s ease;
        }

        .menu-btn:hover {
            border-color: var(--accent-green);
            color: var(--accent-green);
        }

        .dropdown-menu {
            position: absolute;
            right: 0;
            top: 120%;
            background-color: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            width: 220px;
            box-shadow: var(--shadow-lg);
            display: none;
            flex-direction: column;
            overflow: hidden;
            z-index: 200;
        }

        .dropdown-menu.active {
            display: flex;
            animation: fadeIn 0.2s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .dropdown-item {
            padding: 0.85rem 1.2rem;
            color: var(--text-secondary);
            background: none;
            border: none;
            text-align: left;
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            transition: all 0.2s ease;
        }

        .dropdown-item:hover {
            background-color: rgba(255, 255, 255, 0.05);
            color: var(--text-primary);
        }

        .dropdown-item.danger:hover {
            background-color: rgba(239, 68, 68, 0.1);
            color: var(--accent-red);
        }

        /* Main Workspace Container */
        .container {
            max-width: 1100px;
            margin: 2rem auto;
            padding: 0 1.5rem;
            width: 100%;
            flex: 1;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .section-title {
            font-size: 1.5rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .badge {
            background-color: var(--bg-secondary);
            border: 1px solid var(--border-color);
            color: var(--accent-green);
            padding: 0.2rem 0.6rem;
            border-radius: 20px;
            font-size: 0.85rem;
        }

        /* Repository Files Table Layout */
        .file-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: var(--shadow-sm);
        }

        .file-table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        .file-table th {
            background-color: var(--bg-secondary);
            color: var(--text-secondary);
            padding: 1rem 1.25rem;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            border-bottom: 1px solid var(--border-color);
        }

        .file-table td {
            padding: 1rem 1.25rem;
            border-bottom: 1px solid var(--border-color);
            color: var(--text-primary);
            vertical-align: middle;
        }

        .file-table tr:last-child td {
            border-bottom: none;
        }

        .file-table tr:hover {
            background-color: rgba(255, 255, 255, 0.02);
        }

        .file-name-cell {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-weight: 600;
        }

        .file-icon {
            color: var(--accent-blue);
            font-size: 1.2rem;
        }

        /* Action Buttons */
        .btn-download {
            background-color: rgba(16, 185, 129, 0.1);
            color: var(--accent-green);
            border: 1px solid rgba(16, 185, 129, 0.3);
            padding: 0.4rem 0.9rem;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            text-decoration: none;
            transition: all 0.2s ease;
        }

        .btn-download:hover {
            background-color: var(--accent-green);
            color: #ffffff;
        }

        .btn-delete-item {
            background-color: rgba(239, 68, 68, 0.1);
            color: var(--accent-red);
            border: 1px solid rgba(239, 68, 68, 0.3);
            padding: 0.4rem 0.7rem;
            border-radius: 6px;
            cursor: pointer;
            margin-left: 0.5rem;
            transition: all 0.2s ease;
        }

        .btn-delete-item:hover {
            background-color: var(--accent-red);
            color: #ffffff;
        }

        /* Popup Modals */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(4px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background-color: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            width: 100%;
            max-width: 450px;
            padding: 1.75rem;
            box-shadow: var(--shadow-lg);
            position: relative;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.25rem;
        }

        .modal-header h3 {
            font-size: 1.2rem;
            font-weight: 700;
        }

        .close-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 1.2rem;
            cursor: pointer;
        }

        .form-group {
            margin-bottom: 1rem;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-bottom: 0.4rem;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 0.75rem;
            background-color: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-primary);
            outline: none;
        }

        .btn-submit {
            width: 100%;
            padding: 0.75rem;
            background-color: var(--accent-green);
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 0.5rem;
            transition: background 0.2s ease;
        }

        .btn-submit:hover {
            background-color: var(--accent-green-hover);
        }

        .btn-danger-submit {
            background-color: var(--accent-red);
        }

        .btn-danger-submit:hover {
            background-color: var(--accent-red-hover);
        }

        .empty-state {
            text-align: center;
            padding: 3rem 1rem;
            color: var(--text-secondary);
        }

        .empty-state i {
            font-size: 3rem;
            margin-bottom: 1rem;
            opacity: 0.5;
        }
    </style>
</head>
<body>

    <!-- Top Navigation Bar -->
    <nav class="navbar">
        <div class="brand">
            <i class="fa-brands fa-github"></i>
            <span>GitDrive Hub</span>
        </div>
        <div class="nav-actions">
            <button class="menu-btn" id="menuToggle">
                <i class="fa-solid fa-bars"></i>
                <span>মেনু</span>
                <i class="fa-solid fa-chevron-down" style="font-size: 0.7rem; margin-left: 0.2rem;"></i>
            </button>
            <div class="dropdown-menu" id="dropdownMenu">
                <button class="dropdown-item" id="btnOpenUpload">
                    <i class="fa-solid fa-cloud-arrow-up" style="color: var(--accent-green);"></i>
                    <span>1. Upload</span>
                </button>
                <button class="dropdown-item danger" id="btnOpenDelete">
                    <i class="fa-solid fa-trash-can" style="color: var(--accent-red);"></i>
                    <span>2. Upload File Delete</span>
                </button>
                <button class="dropdown-item" id="btnOpenSettings">
                    <i class="fa-solid fa-gear" style="color: var(--accent-blue);"></i>
                    <span>3. Config Settings</span>
                </button>
            </div>
        </div>
    </nav>

    <!-- Main Workspace -->
    <div class="container">
        <div class="section-header">
            <h2 class="section-title">
                ফাইল সমূহ 
                <span class="badge" id="fileCount">0</span>
            </h2>
            <button class="menu-btn" id="btnRefresh" style="padding: 0.4rem 0.8rem; font-size: 0.85rem;">
                <i class="fa-solid fa-rotate-right"></i> রিফ্রেশ
            </button>
        </div>

        <div class="file-card">
            <table class="file-table">
                <thead>
                    <tr>
                        <th>ফাইল নাম</th>
                        <th>টাইপ / সাইজ</th>
                        <th style="text-align: right;">অ্যাকশন</th>
                    </tr>
                </thead>
                <tbody id="fileListBody">
                    <!-- Files will load here dynamically -->
                </tbody>
            </table>
            <div id="emptyState" class="empty-state" style="display: none;">
                <i class="fa-regular fa-folder-open"></i>
                <p>কোনো ফাইল পাওয়া যায়নি অথবা GitHub API কনফিগার করা হয়নি।</p>
            </div>
        </div>
    </div>

    <!-- Upload Modal -->
    <div class="modal-overlay" id="uploadModal">
        <div class="modal">
            <div class="modal-header">
                <h3>GitHub-এ ফাইল আপলোড</h3>
                <button class="close-btn">&times;</button>
            </div>
            <form id="uploadForm">
                <div class="form-group">
                    <label>ফাইল সিলেক্ট করুন</label>
                    <input type="file" id="fileInput" required>
                </div>
                <div class="form-group">
                    <label>কমিট মেসেজ (Commit Message)</label>
                    <input type="text" id="commitMsg" value="Add new file via web" required>
                </div>
                <button type="submit" class="btn-submit" id="uploadSubmitBtn">আপলোড নিশ্চিত করুন</button>
            </form>
        </div>
    </div>

    <!-- Delete Modal -->
    <div class="modal-overlay" id="deleteModal">
        <div class="modal">
            <div class="modal-header">
                <h3>ফাইল মুছে ফেলুন</h3>
                <button class="close-btn">&times;</button>
            </div>
            <form id="deleteForm">
                <div class="form-group">
                    <label>মুছে ফেলার ফাইল সিলেক্ট করুন</label>
                    <select id="deleteFileSelect" required>
                        <option value="">-- সিলেক্ট ফাইল --</option>
                    </select>
                </div>
                <button type="submit" class="btn-submit btn-danger-submit" id="deleteSubmitBtn">ডিলেট করুন</button>
            </form>
        </div>
    </div>

    <!-- Settings/Config Modal -->
    <div class="modal-overlay" id="settingsModal">
        <div class="modal">
            <div class="modal-header">
                <h3>GitHub Setup</h3>
                <button class="close-btn">&times;</button>
            </div>
            <form id="settingsForm">
                <div class="form-group">
                    <label>GitHub Username</label>
                    <input type="text" id="cfgUser" placeholder="ex: your-username" required>
                </div>
                <div class="form-group">
                    <label>Repository Name</label>
                    <input type="text" id="cfgRepo" placeholder="ex: my-repo" required>
                </div>
                <div class="form-group">
                    <label>Personal Access Token (PAT)</label>
                    <input type="password" id="cfgToken" placeholder="ghp_xxxxxxxxxxxx" required>
                </div>
                <button type="submit" class="btn-submit">সেভ করুন</button>
            </form>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
