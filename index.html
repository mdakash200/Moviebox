<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitDrive Hub - GitHub File Manager</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --bg-card: #131c31;
            --accent-green: #10b981;
            --accent-green-hover: #059669;
            --accent-blue: #3b82f6;
            --accent-red: #ef4444;
            --accent-red-hover: #dc2626;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --border-color: #334155;
            --shadow-sm: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
            --shadow-lg: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .navbar {
            background-color: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: var(--shadow-sm);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        .brand i {
            color: var(--accent-green);
            font-size: 1.5rem;
        }

        .nav-actions {
            position: relative;
        }

        .menu-btn {
            background: linear-gradient(135deg, #1e293b, #0f172a);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            padding: 0.6rem 1.2rem;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: all 0.2s ease;
        }

        .menu-btn:hover {
            border-color: var(--accent-green);
            color: var(--accent-green);
        }

        .dropdown-menu {
            position: absolute;
            right: 0;
            top: 120%;
            background-color: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            width: 220px;
            box-shadow: var(--shadow-lg);
            display: none;
            flex-direction: column;
            overflow: hidden;
            z-index: 200;
        }

        .dropdown-menu.active {
            display: flex;
            animation: fadeIn 0.2s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .dropdown-item {
            padding: 0.85rem 1.2rem;
            color: var(--text-secondary);
            background: none;
            border: none;
            text-align: left;
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            transition: all 0.2s ease;
        }

        .dropdown-item:hover {
            background-color: rgba(255, 255, 255, 0.05);
            color: var(--text-primary);
        }

        .dropdown-item.danger:hover {
            background-color: rgba(239, 68, 68, 0.1);
            color: var(--accent-red);
        }

        .container {
            max-width: 1100px;
            margin: 2rem auto;
            padding: 0 1.5rem;
            width: 100%;
            flex: 1;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
        }

        .section-title {
            font-size: 1.5rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .badge {
            background-color: var(--bg-secondary);
            border: 1px solid var(--border-color);
            color: var(--accent-green);
            padding: 0.2rem 0.6rem;
            border-radius: 20px;
            font-size: 0.85rem;
        }

        .file-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: var(--shadow-sm);
        }

        .file-table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        .file-table th {
            background-color: var(--bg-secondary);
            color: var(--text-secondary);
            padding: 1rem 1.25rem;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            border-bottom: 1px solid var(--border-color);
        }

        .file-table td {
            padding: 1rem 1.25rem;
            border-bottom: 1px solid var(--border-color);
            color: var(--text-primary);
            vertical-align: middle;
        }

        .file-table tr:last-child td {
            border-bottom: none;
        }

        .file-table tr:hover {
            background-color: rgba(255, 255, 255, 0.02);
        }

        .file-name-cell {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-weight: 600;
        }

        .file-icon {
            color: var(--accent-blue);
            font-size: 1.2rem;
        }

        .btn-download {
            background-color: rgba(16, 185, 129, 0.1);
            color: var(--accent-green);
            border: 1px solid rgba(16, 185, 129, 0.3);
            padding: 0.4rem 0.9rem;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            text-decoration: none;
            transition: all 0.2s ease;
        }

        .btn-download:hover {
            background-color: var(--accent-green);
            color: #ffffff;
        }

        .btn-delete-item {
            background-color: rgba(239, 68, 68, 0.1);
            color: var(--accent-red);
            border: 1px solid rgba(239, 68, 68, 0.3);
            padding: 0.4rem 0.7rem;
            border-radius: 6px;
            cursor: pointer;
            margin-left: 0.5rem;
            transition: all 0.2s ease;
        }

        .btn-delete-item:hover {
            background-color: var(--accent-red);
            color: #ffffff;
        }

        /* Modal Overlay */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(5px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background-color: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            width: 100%;
            max-width: 480px;
            padding: 1.75rem;
            box-shadow: var(--shadow-lg);
            position: relative;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.25rem;
        }

        .modal-header h3 {
            font-size: 1.2rem;
            font-weight: 700;
        }

        .close-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 1.2rem;
            cursor: pointer;
        }

        .form-group {
            margin-bottom: 1.2rem;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-bottom: 0.4rem;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 0.75rem;
            background-color: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-primary);
            outline: none;
        }

        /* Drag and Drop Zone */
        .drop-zone {
            border: 2px dashed var(--border-color);
            border-radius: 12px;
            padding: 1.5rem;
            text-align: center;
            background-color: var(--bg-primary);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .drop-zone:hover, .drop-zone.dragover {
            border-color: var(--accent-green);
            background-color: rgba(16, 185, 129, 0.05);
        }

        .drop-zone i {
            font-size: 2.2rem;
            color: var(--accent-green);
            margin-bottom: 0.5rem;
        }

        .drop-zone p {
            font-size: 0.9rem;
            color: var(--text-secondary);
        }

        .file-selected-name {
            margin-top: 0.5rem;
            font-weight: 600;
            color: var(--accent-blue);
            font-size: 0.85rem;
            word-break: break-all;
        }

        /* Progress Bar UI */
        .progress-container {
            margin-top: 1rem;
            display: none;
        }

        .progress-label {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-bottom: 0.4rem;
        }

        .progress-bar-bg {
            width: 100%;
            height: 10px;
            background-color: var(--bg-primary);
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid var(--border-color);
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--accent-green), #34d399);
            transition: width 0.2s ease;
            border-radius: 10px;
        }

        .btn-submit {
            width: 100%;
            padding: 0.75rem;
            background-color: var(--accent-green);
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 0.5rem;
            transition: background 0.2s ease;
        }

        .btn-submit:hover {
            background-color: var(--accent-green-hover);
        }

        .btn-danger-submit {
            background-color: var(--accent-red);
        }

        .btn-danger-submit:hover {
            background-color: var(--accent-red-hover);
        }

        .empty-state {
            text-align: center;
            padding: 3rem 1rem;
            color: var(--text-secondary);
        }

        .empty-state i {
            font-size: 3rem;
            margin-bottom: 1rem;
            opacity: 0.5;
        }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar">
        <div class="brand">
            <i class="fa-brands fa-github"></i>
            <span>GitDrive Hub</span>
        </div>
        <div class="nav-actions">
            <button class="menu-btn" id="menuToggle">
                <i class="fa-solid fa-bars"></i>
                <span>মেনু</span>
                <i class="fa-solid fa-chevron-down" style="font-size: 0.7rem; margin-left: 0.2rem;"></i>
            </button>
            <div class="dropdown-menu" id="dropdownMenu">
                <button class="dropdown-item" id="btnOpenUpload">
                    <i class="fa-solid fa-cloud-arrow-up" style="color: var(--accent-green);"></i>
                    <span>1. Upload</span>
                </button>
                <button class="dropdown-item danger" id="btnOpenDelete">
                    <i class="fa-solid fa-trash-can" style="color: var(--accent-red);"></i>
                    <span>2. Upload File Delete</span>
                </button>
                <button class="dropdown-item" id="btnOpenSettings">
                    <i class="fa-solid fa-gear" style="color: var(--accent-blue);"></i>
                    <span>3. Config Settings</span>
                </button>
            </div>
        </div>
    </nav>

    <!-- Main Container -->
    <div class="container">
        <div class="section-header">
            <h2 class="section-title">
                ফাইল সমূহ 
                <span class="badge" id="fileCount">0</span>
            </h2>
            <button class="menu-btn" id="btnRefresh" style="padding: 0.4rem 0.8rem; font-size: 0.85rem;">
                <i class="fa-solid fa-rotate-right"></i> রিফ্রেশ
            </button>
        </div>

        <div class="file-card">
            <table class="file-table">
                <thead>
                    <tr>
                        <th>ফাইল নাম</th>
                        <th>টাইপ / সাইজ</th>
                        <th style="text-align: right;">অ্যাকশন</th>
                    </tr>
                </thead>
                <tbody id="fileListBody"></tbody>
            </table>
            <div id="emptyState" class="empty-state" style="display: none;">
                <i class="fa-regular fa-folder-open"></i>
                <p>কোনো ফাইল পাওয়া যায়নি অথবা GitHub API কনফিগার করা হয়নি।</p>
            </div>
        </div>
    </div>

    <!-- Upload Modal -->
    <div class="modal-overlay" id="uploadModal">
        <div class="modal">
            <div class="modal-header">
                <h3>GitHub-এ ফাইল আপলোড</h3>
                <button class="close-btn">&times;</button>
            </div>
            <form id="uploadForm">
                <div class="form-group">
                    <label>ফাইল সিলেক্ট করুন</label>
                    <div class="drop-zone" id="dropZone">
                        <i class="fa-solid fa-cloud-arrow-up"></i>
                        <p>ফাইল ড্র্যাগ করে আনুন অথবা <b>ক্লিক করুন</b></p>
                        <div class="file-selected-name" id="selectedFileName"></div>
                        <input type="file" id="fileInput" style="display: none;" required>
                    </div>
                </div>
                <div class="form-group">
                    <label>কমিট মেসেজ (Commit Message)</label>
                    <input type="text" id="commitMsg" value="Add new file via web" required>
                </div>

                <!-- Progress Bar UI -->
                <div class="progress-container" id="progressContainer">
                    <div class="progress-label">
                        <span id="uploadStatusText">আপলোড হচ্ছে...</span>
                        <span id="uploadProgressPercent">0%</span>
                    </div>
                    <div class="progress-bar-bg">
                        <div class="progress-bar-fill" id="uploadProgressBar"></div>
                    </div>
                </div>

                <button type="submit" class="btn-submit" id="uploadSubmitBtn" style="margin-top: 1rem;">আপলোড নিশ্চিত করুন</button>
            </form>
        </div>
    </div>

    <!-- Delete Modal -->
    <div class="modal-overlay" id="deleteModal">
        <div class="modal">
            <div class="modal-header">
                <h3>ফাইল মুছে ফেলুন</h3>
                <button class="close-btn">&times;</button>
            </div>
            <form id="deleteForm">
                <div class="form-group">
                    <label>মুছে ফেলার ফাইল সিলেক্ট করুন</label>
                    <select id="deleteFileSelect" required>
                        <option value="">-- সিলেক্ট ফাইল --</option>
                    </select>
                </div>
                <button type="submit" class="btn-submit btn-danger-submit" id="deleteSubmitBtn">ডিলেট করুন</button>
            </form>
        </div>
    </div>

    <!-- Settings Modal -->
    <div class="modal-overlay" id="settingsModal">
        <div class="modal">
            <div class="modal-header">
                <h3>GitHub Setup</h3>
                <button class="close-btn">&times;</button>
            </div>
            <form id="settingsForm">
                <div class="form-group">
                    <label>GitHub Username</label>
                    <input type="text" id="cfgUser" placeholder="ex: your-username" required>
                </div>
                <div class="form-group">
                    <label>Repository Name</label>
                    <input type="text" id="cfgRepo" placeholder="ex: my-repo" required>
                </div>
                <div class="form-group">
                    <label>Personal Access Token (PAT)</label>
                    <input type="password" id="cfgToken" placeholder="ghp_xxxxxxxxxxxx" required>
                </div>
                <button type="submit" class="btn-submit">সেভ করুন</button>
            </form>
        </div>
    </div>

    <script>
      // GitHub Integration & Live Upload Progress Manager

let githubConfig = {
    username: localStorage.getItem('gh_user') || '',
    repo: localStorage.getItem('gh_repo') || '',
    token: localStorage.getItem('gh_token') || ''
};

let repositoryFiles = [];

// DOM Elements
const menuToggle = document.getElementById('menuToggle');
const dropdownMenu = document.getElementById('dropdownMenu');
const uploadModal = document.getElementById('uploadModal');
const deleteModal = document.getElementById('deleteModal');
const settingsModal = document.getElementById('settingsModal');
const dropZone = document.getElementById('dropZone');
const fileInput = document.getElementById('fileInput');
const selectedFileName = document.getElementById('selectedFileName');

// Open/Close Dropdown Menu
menuToggle.addEventListener('click', (e) => {
    e.stopPropagation();
    dropdownMenu.classList.toggle('active');
});

document.addEventListener('click', () => {
    dropdownMenu.classList.remove('active');
});

// Modal Toggles
document.getElementById('btnOpenUpload').addEventListener('click', () => {
    checkConfigAndOpen(uploadModal);
});

document.getElementById('btnOpenDelete').addEventListener('click', () => {
    populateDeleteDropdown();
    checkConfigAndOpen(deleteModal);
});

document.getElementById('btnOpenSettings').addEventListener('click', () => {
    document.getElementById('cfgUser').value = githubConfig.username;
    document.getElementById('cfgRepo').value = githubConfig.repo;
    document.getElementById('cfgToken').value = githubConfig.token;
    openModal(settingsModal);
});

document.querySelectorAll('.close-btn').forEach(btn => {
    btn.addEventListener('click', () => {
        closeAllModals();
    });
});

function openModal(modal) {
    closeAllModals();
    modal.classList.add('active');
}

function closeAllModals() {
    uploadModal.classList.remove('active');
    deleteModal.classList.remove('active');
    settingsModal.classList.remove('active');
    resetUploadUI();
}

function checkConfigAndOpen(modal) {
    if (!githubConfig.username || !githubConfig.repo || !githubConfig.token) {
        alert('আগে আপনার GitHub Username, Repo এবং Personal Access Token সেটআপ করুন!');
        openModal(settingsModal);
    } else {
        openModal(modal);
    }
}

// Drag & Drop Handling
dropZone.addEventListener('click', () => fileInput.click());

dropZone.addEventListener('dragover', (e) => {
    e.preventDefault();
    dropZone.classList.add('dragover');
});

['dragleave', 'dragend'].forEach(type => {
    dropZone.addEventListener(type, () => dropZone.classList.remove('dragover'));
});

dropZone.addEventListener('drop', (e) => {
    e.preventDefault();
    dropZone.classList.remove('dragover');
    if (e.dataTransfer.files.length) {
        fileInput.files = e.dataTransfer.files;
        updateSelectedFileName();
    }
});

fileInput.addEventListener('change', updateSelectedFileName);

function updateSelectedFileName() {
    if (fileInput.files.length > 0) {
        selectedFileName.textContent = `সিলেক্টেড ফাইল: ${fileInput.files[0].name}`;
    } else {
        selectedFileName.textContent = '';
    }
}

// Save Settings Form
document.getElementById('settingsForm').addEventListener('submit', (e) => {
    e.preventDefault();
    githubConfig.username = document.getElementById('cfgUser').value.trim();
    githubConfig.repo = document.getElementById('cfgRepo').value.trim();
    githubConfig.token = document.getElementById('cfgToken').value.trim();

    localStorage.setItem('gh_user', githubConfig.username);
    localStorage.setItem('gh_repo', githubConfig.repo);
    localStorage.setItem('gh_token', githubConfig.token);

    alert('GitHub কনফিগারেশন সফলভাবে সেভ হয়েছে!');
    closeAllModals();
    fetchRepositoryFiles();
});

// Fetch Repository Content via GitHub REST API
async function fetchRepositoryFiles() {
    if (!githubConfig.username || !githubConfig.repo) {
        renderFileList([]);
        return;
    }

    const fileListBody = document.getElementById('fileListBody');
    fileListBody.innerHTML = '<tr><td colspan="3" style="text-align:center; padding: 2rem;">ফাইল লোড হচ্ছে...</td></tr>';

    try {
        const authHeader = githubConfig.token.startsWith('github_pat_') 
            ? `Bearer ${githubConfig.token}` 
            : `token ${githubConfig.token}`;

        const response = await fetch(`https://api.github.com/repos/${githubConfig.username}/${githubConfig.repo}/contents`, {
            headers: githubConfig.token ? { 'Authorization': authHeader } : {}
        });

        if (!response.ok) throw new Error('Repository load failed');

        const data = await response.json();
        repositoryFiles = data.filter(item => item.type === 'file');
        renderFileList(repositoryFiles);
    } catch (err) {
        console.error(err);
        document.getElementById('fileListBody').innerHTML = '';
        document.getElementById('emptyState').style.display = 'block';
        document.getElementById('fileCount').textContent = '0';
    }
}

// Render File Table Layout
function renderFileList(files) {
    const fileListBody = document.getElementById('fileListBody');
    const emptyState = document.getElementById('emptyState');
    const fileCount = document.getElementById('fileCount');

    fileListBody.innerHTML = '';
    fileCount.textContent = files.length;

    if (files.length === 0) {
        emptyState.style.display = 'block';
        return;
    }

    emptyState.style.display = 'none';

    files.forEach(file => {
        const tr = document.createElement('tr');
        
        let iconClass = 'fa-file-lines';
        if (file.name.match(/\.(jpg|jpeg|png|gif|svg)$/i)) iconClass = 'fa-file-image';
        else if (file.name.match(/\.(zip|rar|7z)$/i)) iconClass = 'fa-file-zipper';
        else if (file.name.match(/\.(html|css|js|json|php)$/i)) iconClass = 'fa-file-code';

        tr.innerHTML = `
            <td>
                <div class="file-name-cell">
                    <i class="fa-solid ${iconClass} file-icon"></i>
                    <span>${file.name}</span>
                </div>
            </td>
            <td style="color: var(--text-secondary); font-size: 0.9rem;">
                ${(file.size / 1024).toFixed(1)} KB
            </td>
            <td style="text-align: right;">
                <a href="${file.download_url}" class="btn-download" download target="_blank">
                    <i class="fa-solid fa-download"></i> ডাউনলোড
                </a>
                <button class="btn-delete-item" onclick="deleteFileDirect('${file.name}', '${file.sha}')" title="ডিলেট করুন">
                    <i class="fa-solid fa-trash"></i>
                </button>
            </td>
        `;
        fileListBody.appendChild(tr);
    });
}

// Upload File Processing with Progress Bar
document.getElementById('uploadForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const commitMsg = document.getElementById('commitMsg').value;
    const submitBtn = document.getElementById('uploadSubmitBtn');
    const progressBox = document.getElementById('progressContainer');
    const progressBar = document.getElementById('uploadProgressBar');
    const progressPercent = document.getElementById('uploadProgressPercent');
    const statusText = document.getElementById('uploadStatusText');

    if (!fileInput.files.length) return;

    const file = fileInput.files[0];
    submitBtn.disabled = true;
    progressBox.style.display = 'block';
    statusText.textContent = 'প্রসেস করা হচ্ছে...';

    try {
        const base64Content = await convertBase64(file);
        
        const existingFile = repositoryFiles.find(f => f.name === file.name);
        const payload = {
            message: commitMsg,
            content: base64Content
        };
        if (existingFile) {
            payload.sha = existingFile.sha;
        }

        const xhr = new XMLHttpRequest();
        xhr.open('PUT', `https://api.github.com/repos/${githubConfig.username}/${githubConfig.repo}/contents/${file.name}`);
        
        const authHeader = githubConfig.token.startsWith('github_pat_') 
            ? `Bearer ${githubConfig.token}` 
            : `token ${githubConfig.token}`;

        xhr.setRequestHeader('Authorization', authHeader);
        xhr.setRequestHeader('Content-Type', 'application/json');

        xhr.upload.onprogress = (e) => {
            if (e.lengthComputable) {
                const percent = Math.round((e.loaded / e.total) * 100);
                progressBar.style.width = percent + '%';
                progressPercent.textContent = percent + '%';
                statusText.textContent = 'আপলোড হচ্ছে...';
            }
        };

        xhr.onload = () => {
            if (xhr.status >= 200 && xhr.status < 300) {
                progressBar.style.width = '100%';
                progressPercent.textContent = '100%';
                statusText.textContent = 'আপলোড সম্পন্ন!';

                setTimeout(() => {
                    alert('ফাইল সফলভাবে GitHub-এ আপলোড হয়েছে!');
                    closeAllModals();
                    fetchRepositoryFiles();
                }, 300);
            } else {
                const errData = JSON.parse(xhr.responseText || '{}');
                alert('আপলোড ব্যর্থ হয়েছে: ' + (errData.message || 'অজানা সমস্যা'));
                resetUploadUI();
            }
        };

        xhr.onerror = () => {
            alert('নেটওয়ার্ক ত্রুটি বা আপলোড ব্যর্থ হয়েছে!');
            resetUploadUI();
        };

        xhr.send(JSON.stringify(payload));

    } catch (err) {
        alert('ত্রুটি: ' + err.message);
        resetUploadUI();
    }
});

function resetUploadUI() {
    const submitBtn = document.getElementById('uploadSubmitBtn');
    const progressBox = document.getElementById('progressContainer');
    const progressBar = document.getElementById('uploadProgressBar');
    const progressPercent = document.getElementById('uploadProgressPercent');

    if (submitBtn) submitBtn.disabled = false;
    if (progressBox) progressBox.style.display = 'none';
    if (progressBar) progressBar.style.width = '0%';
    if (progressPercent) progressPercent.textContent = '0%';
    if (fileInput) fileInput.value = '';
    if (selectedFileName) selectedFileName.textContent = '';
}

// Convert File to Base64 String
function convertBase64(file) {
    return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = () => {
            const base64String = reader.result.split(',')[1];
            resolve(base64String);
        };
        reader.onerror = error => reject(error);
    });
}

// Populate Delete Modal Dropdown
function populateDeleteDropdown() {
    const select = document.getElementById('deleteFileSelect');
    select.innerHTML = '<option value="">-- সিলেক্ট ফাইল --</option>';

    repositoryFiles.forEach(file => {
        const opt = document.createElement('option');
        opt.value = JSON.stringify({ name: file.name, sha: file.sha });
        opt.textContent = file.name;
        select.appendChild(opt);
    });
}

// Delete File Processing
document.getElementById('deleteForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const selectVal = document.getElementById('deleteFileSelect').value;
    if (!selectVal) return;

    const { name, sha } = JSON.parse(selectVal);
    await executeDelete(name, sha);
});

async function deleteFileDirect(filename, sha) {
    if (confirm(`আপনি কি সত্যি "${filename}" ফাইলটি GitHub থেকে মুছে ফেলতে চান?`)) {
        await executeDelete(filename, sha);
    }
}

async function executeDelete(filename, sha) {
    try {
        const authHeader = githubConfig.token.startsWith('github_pat_') 
            ? `Bearer ${githubConfig.token}` 
            : `token ${githubConfig.token}`;

        const response = await fetch(`https://api.github.com/repos/${githubConfig.username}/${githubConfig.repo}/contents/${filename}`, {
            method: 'DELETE',
            headers: {
                'Authorization': authHeader,
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({
                message: `Delete ${filename} via web interface`,
                sha: sha
            })
        });

        if (response.ok) {
            alert('ফাইলটি মুছে ফেলা হয়েছে!');
            closeAllModals();
            fetchRepositoryFiles();
        } else {
            const errData = await response.json();
            alert('ডিলেট করতে সমস্যা হয়েছে: ' + (errData.message || 'অজানা সমস্যা'));
        }
    } catch (err) {
        alert('ত্রুটি: ' + err.message);
    }
}

document.getElementById('btnRefresh').addEventListener('click', fetchRepositoryFiles);

document.addEventListener('DOMContentLoaded', () => {
    if (githubConfig.username && githubConfig.repo) {
        fetchRepositoryFiles();
    }
});

    </script>
